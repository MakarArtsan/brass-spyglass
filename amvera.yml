# Конфигурация Amvera: один Docker-проект, persistent-диск /data (SQLite, файлы, кэш, бэкапы).
# docker-compose Amvera не поддерживает — только Dockerfile из корня репозитория.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  persistenceMount: /data
  containerPort: 8000
